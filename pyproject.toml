[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neural-particle-method"
version = "0.1.0"
description = "Neural Particle Method"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "torch>=2.3",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "quantlib>=1.43",
    "pandas>=3.0.5",
    "mlflow>=2.14",
]

[project.scripts]
nparticle = "neural_particle_method.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "ipykernel>=6.29",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neural_particle_method"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: bit-for-bit replay of archived runs; minutes; run with -m golden",
    "slow: multi-minute smoke runs; run with -m slow",
]
addopts = "-m 'not golden and not slow'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-ignore = ["B008"]
